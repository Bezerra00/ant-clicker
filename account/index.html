
<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title>Ant Clicker - Account</title>
        <link rel="stylesheet" href="style.css">
        <script src="../js/auth/delete_account.js" defer></script>
        <scrit src="../js/auth/change_username.js" defer></scrit>
    </head>
    <body class="sec_center">
        <h1>Account Settings</h1>

        <section>
            <h2>Delete Account</h2>

            <p>
                This action is permanent. Your account and game progress
                will be deleted.
            </p>

            <form id="delete_account_form">
                <label for="password">Enter your password:</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <laber for="username"> Enter your new username:</laber>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

                <button type="submit">
                    Delete Account
                </button>
            </form>

            <p id="delete_message"></p>
        </section>

        <section>
            <h2>Change username</h2>

            <form id="change_username_form">
                <label for="password_u">Enter your password:</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button type="submit">
                    Change username
                </button>
            </form>

            <p id="change_message"></p>

        </section>

        <a href="../jogo/">Back to Game</a>
    </body>
</html>
